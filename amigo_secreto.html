<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amigo Secreto Familiar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    .sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    label.check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button {
      background: var(--accent);
      color: #06202a;
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }
    button.secondary {
      background: #334155;
      color: var(--text);
    }
    button.success {
      background: var(--accent-2);
      color: #052e16;
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .who { font-weight: 700; font-size: 1.02rem; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .status {
      font-size: 0.8rem;
      color: var(--accent-2);
      min-width: 72px;
      text-align: right;
    }

    /* Vista cuando alguien abre un enlace cifrado */
    .reveal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      max-width: 480px;
      margin: 40px auto;
    }
    .target-name {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin: 18px 0 24px;
      padding: 16px;
      background: var(--card-2);
      border-radius: 12px;
      border: 1px dashed var(--accent);
    }

    /* Modal kiosco presencial */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 22px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .notice {
      background: var(--card-2);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div id="app" class="container"></div>

  <div id="kioskModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="kioskTitle" class="meta"></div>
      <div id="kioskTarget" class="target-name"></div>
      <button class="success" onclick="closeKiosk()">Ocultar y terminar</button>
    </div>
  </div>

  <script>
    const PARTICIPANTS = [
      { id: "julio",     name: "Julio",            family: 1, mode: "kiosk" },
      { id: "virginia",  name: "Virginia",         family: 1, mode: "kiosk" },
      { id: "ingrid",    name: "Ingrid",           family: 2, mode: "wa", via: null },
      { id: "guillermo", name: "Guillermo",        family: 2, mode: "wa", via: null },
      { id: "anthony",   name: "Anthony",          family: 3, mode: "wa", via: null },
      { id: "adriana",   name: "Adriana",          family: 3, mode: "wa", via: null },
      { id: "julian",    name: "Julián",           family: 3, mode: "wa", via: null },
      { id: "mateo",     name: "Mateo",            family: 3, mode: "wa", via: "Anthony y Adriana" },
      { id: "sofia",     name: "Sofía",            family: 4, mode: "wa", via: null },
      { id: "marco",     name: "Marco",            family: 4, mode: "wa", via: null },
      { id: "braulio",   name: "Braulio",          family: 4, mode: "wa", via: "Sofía y Marco" },
      { id: "lisseth",   name: "Lisseth",          family: 5, mode: "wa", via: null },
      { id: "roy",       name: "Roy",              family: 5, mode: "wa", via: null },
      { id: "mvictoria", name: "María Victoria",   family: 5, mode: "wa", via: "Lisseth y Roy" },
      { id: "heiner",    name: "Heiner",           family: 6, mode: "kiosk" }
    ];

    // Clave simple para ofuscar el payload en la URL (evita lectura directa a simple vista)
    const SECRET_KEY = "KROMA-AMIGO-SECRETO-2026";

    function xorCipher(str) {
      let out = "";
      for (let i = 0; i < str.length; i++) {
        out += String.fromCharCode(str.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
      }
      return out;
    }

    function encodePayload(obj) {
      const json = JSON.stringify(obj);
      const utf8Bytes = unescape(encodeURIComponent(json));
      const ciphered = xorCipher(utf8Bytes);
      return btoa(ciphered).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodePayload(token) {
      try {
        let b64 = token.replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        const ciphered = atob(b64);
        const utf8Bytes = xorCipher(ciphered);
        const json = decodeURIComponent(escape(utf8Bytes));
        return JSON.parse(json);
      } catch {
        return null;
      }
    }

    // Si alguien abre un link con #d=..., mostramos solo su resultado
    function checkSharedLink() {
      const hash = window.location.hash || "";
      if (!hash.startsWith("#d=")) return false;
      const token = hash.slice(3);
      const data = decodePayload(token);
      if (!data || !data.giver || !data.receiver) return false;

      document.getElementById("app").innerHTML = `
        <div class="reveal-box">
          <div class="meta">Amigo Secreto Familiar</div>
          <h1>¡Hola, ${escapeHtml(data.giver)}!</h1>
          <p class="sub">Tu amigo secreto asignado es:</p>
          <div class="target-name">${escapeHtml(data.receiver)}</div>
          <p class="meta">Guarda el secreto para el día del intercambio.</p>
        </div>
      `;
      return true;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateAssignment(avoidSameFamily) {
      const givers = PARTICIPANTS;
      for (let attempt = 0; attempt < 2000; attempt++) {
        const receivers = shuffle(PARTICIPANTS);
        let valid = true;
        for (let i = 0; i < givers.length; i++) {
          if (givers[i].id === receivers[i].id) { valid = false; break; }
          if (avoidSameFamily && givers[i].family === receivers[i].family) { valid = false; break; }
        }
        if (valid) {
          const map = {};
          for (let i = 0; i < givers.length; i++) {
            map[givers[i].id] = receivers[i].name;
          }
          return map;
        }
      }
      return null;
    }

    let state = {
      avoidSameFamily: true,
      assignments: null,
      statuses: {}
    };

    function runDraw() {
      const map = generateAssignment(state.avoidSameFamily);
      if (!map) {
        alert("No se pudo encontrar una combinación con esas reglas. Intenta de nuevo.");
        return;
      }
      state.assignments = map;
      state.statuses = {};
      renderOrganizer();
    }

    function buildLink(giverName, receiverName) {
      const base = window.location.href.split("#")[0];
      const token = encodePayload({ giver: giverName, receiver: receiverName });
      return `${base}#d=${token}`;
    }

    function buildWaMessage(person, receiverName) {
      const link = buildLink(person.name, receiverName);
      if (person.via) {
        return `¡Hola ${person.via}! Este es el enlace del Amigo Secreto para *${person.name}*: ${link}`;
      }
      return `¡Hola ${person.name}! Aquí tienes tu enlace del Amigo Secreto: ${link}`;
    }

    async function copyWaMsg(id) {
      if (!state.assignments) return;
      const person = PARTICIPANTS.find(p => p.id === id);
      const msg = buildWaMessage(person, state.assignments[id]);
      try {
        await navigator.clipboard.writeText(msg);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = msg;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      state.statuses[id] = "Copiado ✓";
      renderOrganizer();
    }

    function openKiosk(id) {
      if (!state.assignments) return;
      const person = PARTICIPANTS.find(p => p.id === id);
      document.getElementById("kioskTitle").textContent = `Turno de ${person.name} — Amigo Secreto`;
      document.getElementById("kioskTarget").textContent = state.assignments[id];
      document.getElementById("kioskModal").classList.add("open");
      state.statuses[id] = "Visto ✓";
      renderOrganizer();
    }

    function closeKiosk() {
      document.getElementById("kioskModal").classList.remove("open");
      document.getElementById("kioskTarget").textContent = "";
    }

    function renderOrganizer() {
      const hasDraw = Boolean(state.assignments);
      const rowsHtml = PARTICIPANTS.map(p => {
        const detail = p.via
          ? `WhatsApp (vía ${p.via})`
          : (p.mode === "kiosk" ? "Pantalla privada / Presencial" : "WhatsApp");

        const actionBtn = !hasDraw
          ? `<span class="meta">Haz el sorteo primero</span>`
          : (p.mode === "kiosk"
              ? `<button onclick="openKiosk('${p.id}')">Ver en pantalla</button>`
              : `<button onclick="copyWaMsg('${p.id}')">Copiar msg WhatsApp</button>`);

        const st = state.statuses[p.id] || "";
        return `
          <div class="row">
            <div>
              <div class="who">${escapeHtml(p.name)}</div>
              <div class="meta">Núcleo ${p.family} · ${escapeHtml(detail)}</div>
            </div>
            <div class="actions">
              <span class="status">${escapeHtml(st)}</span>
              ${actionBtn}
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("app").innerHTML = `
        <div class="header">
          <h1>Sorteo de Amigo Secreto (15 participantes · 6 núcleos)</h1>
          <p class="sub">Los enlaces de WhatsApp ocultan el resultado; Julio, Virginia y Heiner usan pantalla privada.</p>
          <div class="controls">
            <label class="check">
              <input type="checkbox" ${state.avoidSameFamily ? "checked" : ""} onchange="state.avoidSameFamily = this.checked" />
              Evitar que toque alguien del mismo núcleo familiar
            </label>
            <button class="success" onclick="runDraw()">${hasDraw ? "Repetir sorteo" : "Realizar sorteo"}</button>
          </div>
        </div>
        <div class="notice">
          Tip: No verás los nombres en esta pantalla al generar los enlaces ni al copiar los mensajes de WhatsApp.
        </div>
        <div class="list">${rowsHtml}</div>
      `;
    }

    if (!checkSharedLink()) {
      renderOrganizer();
    }
  </script>
</body>
</html>
